<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Mahasiswa - CBT UNIMED</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <style>
    /* Styling Tambahan Khusus Dashboard */
    body {
      display: block;
      background-color: #f1f5f9;
    }
    .navbar {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-brand img {
      width: 40px;
      height: 40px;
    }
    .nav-brand h2 {
      font-size: 16px;
      color: var(--primary);
    }
    .nav-user {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-info {
      text-align: right;
    }
    .user-name {
      font-weight: 700;
      font-size: 14px;
    }
    .user-role {
      font-size: 12px;
      color: var(--text-muted);
    }
    .btn-logout {
      background-color: #fee2e2;
      color: var(--danger);
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
    }
    .btn-logout:hover {
      background-color: #fca5a5;
    }
    .dashboard-container {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 20px;
    }
    .welcome-card {
      background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%);
      color: white;
      padding: 24px 32px;
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
    }
    .welcome-card h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    .welcome-card p {
      color: #cbd5e1;
      font-size: 14px;
    }
    .exam-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }
    .exam-card-header {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .badge-primary { background: #e0e7ff; color: #3730a3; }
    .badge-success { background: #dcfce7; color: #166534; }
    .exam-title {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .exam-desc {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }
    .exam-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      padding: 16px;
      background: #f8fafc;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 13px;
    }
    .exam-action {
      display: flex;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

  <!-- Navbar Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <img src="./assets/logo_unimed.png" alt="Logo UNIMED">
      <div>
        <h2>CBT UNIMED</h2>
        <span style="font-size: 11px; color: var(--text-muted);">Assessment Berpikir Kritis</span>
      </div>
    </div>
    <div class="nav-user">
      <div class="user-info">
        <div id="userName" class="user-name">Loading...</div>
        <div id="userNim" class="user-role">-</div>
      </div>
      <button id="logoutBtn" class="btn-logout">Keluar</button>
    </div>
  </nav>

  <!-- Container Utama Dashboard -->
  <div class="dashboard-container">
    <div class="welcome-card">
      <h1>Selamat Datang di Portal Ujian</h1>
      <p>Silakan periksa daftar ujian yang tersedia di bawah ini. Pastikan koneksi internet Anda stabil sebelum memulai ujian.</p>
    </div>

    <!-- Tempat Daftar Ujian Dimuat -->
    <div id="assessmentList"></div>
  </div>

  <!-- JavaScript Modules -->
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/mahasiswa.js"></script>
</body>
</html>
