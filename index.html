<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Critical Thinking Assessment UNIMED</title>
  <!-- Menghubungkan CSS -->
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

  <div class="login-wrapper">
    <!-- Panel Kiri: Branding & Logo UNIMED -->
    <div class="login-banner">
      <div class="banner-brand">
        <!-- Logo UNIMED -->
        <img src="./assets/logo_unimed.png" alt="Logo UNIMED" class="app-logo">
        <div>
          <h1 class="institution-name">UNIVERSITAS NEGERI MEDAN</h1>
          <p class="app-tagline">CBT ASSESSMENT SYSTEM</p>
        </div>
      </div>

      <div class="banner-content">
        <h2>CRITICAL THINKING ASSESSMENT</h2>
        <p>Pengukuran Kemampuan Berpikir Kritis Berbasis Framework Facione pada Mata Kuliah Kepemimpinan.</p>
      </div>

      <div class="banner-footer">
        &copy; 2026 Universitas Negeri Medan. All rights reserved.
      </div>
    </div>

    <!-- Panel Kanan: Form Login -->
    <div class="login-form-container">
      <div class="login-header">
        <h2>Selamat Datang</h2>
        <p>Silakan login menggunakan NIM, Email, atau NIP Anda</p>
      </div>

      <!-- Alert Pesan Error -->
      <div id="alertBox" class="alert alert-danger" role="alert" style="display: none;"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="identifier">NIM / Email / NIP</label>
          <input 
            type="text" 
            id="identifier" 
            class="form-input" 
            placeholder="Masukkan NIM, Email atau NIP" 
            required 
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="Masukkan password" 
              required
            >
            <button type="button" id="togglePasswordBtn" class="toggle-password">Show</button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">
          <span id="btnText">MASUK</span>
          <span id="btnSpinner" class="spinner" style="display: none;"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Cek apakah sudah login sebelumnya
      if (typeof Auth !== "undefined" && Auth.isAuthenticated()) {
        const user = Auth.getUser();
        if (user && user.role) {
          Auth.redirectUserByRole(user.role);
          return;
        }
      }

      const loginForm = document.getElementById("loginForm");
      const identifierInput = document.getElementById("identifier");
      const passwordInput = document.getElementById("password");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");
      const alertBox = document.getElementById("alertBox");

      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        togglePasswordBtn.textContent = isPassword ? "Hide" : "Show";
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        alertBox.style.display = "none";
        alertBox.textContent = "";

        const identifier = identifierInput.value.trim();
        const password = passwordInput.value;

        if (!identifier || !password) {
          showAlert("NIM/Email/NIP dan Password wajib diisi.");
          return;
        }

        setLoading(true);

        try {
          const response = await API.login(identifier, password);

          // Cek apakah respons sukses (baik membungkus di .data atau langsung di root response)
          const isSuccess = response && (response.success || response.status === "SUCCESS" || response.token || response.session);

          if (isSuccess) {
            // Ambil payload data yang valid (fleksibel terhadap format Apps Script)
            const sessionData = response.data || response;
            
            // Simpan sesi menggunakan Auth helper
            Auth.saveSession(sessionData);
            
            // Ambil role pengguna untuk pengalihan halaman
            const userRole = sessionData.user && sessionData.user.role ? sessionData.user.role : "mahasiswa";
            Auth.redirectUserByRole(userRole);
          } else {
            setLoading(false);
            showAlert(response.message || "Email/NIM atau password salah.");
          }
        } catch (err) {
          setLoading(false);
          showAlert("Terjadi kesalahan koneksi ke server.");
          console.error(err);
        }
      });

      function showAlert(message) {
        alertBox.textContent = message;
        alertBox.style.display = "block";
      }

      function setLoading(isLoading) {
        if (isLoading) {
          submitBtn.disabled = true;
          btnText.textContent = "MEMPROSES...";
          btnSpinner.style.display = "inline-block";
        } else {
          submitBtn.disabled = false;
          btnText.textContent = "MASUK";
          btnSpinner.style.display = "none";
        }
      }
    });
  </script>
</body>
</html>
